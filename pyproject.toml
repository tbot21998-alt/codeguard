[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codeguard-local"
version = "0.1.0"
description = "CPU-only pre-execution guard for generated code and CLI commands"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlglot>=26,<31", "rapidfuzz>=3,<4", "scikit-learn>=1.6,<2", "lightgbm>=4.3,<5", "joblib>=1.4,<2", "python-multipart>=0.0.20,<1"]

[project.scripts]
codeguard = "guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/codeguard/models" = ["models/codeguard.joblib", "models/codeguard.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
